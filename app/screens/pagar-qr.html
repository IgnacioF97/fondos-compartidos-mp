  <div class="qr-saldo">

  <div style="padding:0 20px 24px">
    <button class="btn-secondary" id="manual-btn" style="background:rgba(255,255,255,0.12);color:white;border:1px solid rgba(255,255,255,0.25)">
      Ingresar monto manualmente
